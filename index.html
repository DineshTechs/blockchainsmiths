    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              brand: {
                dark: '#050a14',
                darker: '#02040a',
                primary: '#00f0ff', // Neon Cyan
                secondary: '#00ff9d', // Neon Green
                accent: '#7000ff', // Deep Purple
                surface: '#0f172a',
              }
            },
            backgroundImage: {
              'grid-pattern': "linear-gradient(to right, #1e293b 1px, transparent 1px), linear-gradient(to bottom, #1e293b 1px, transparent 1px)",
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'blob': 'blob 7s infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #050a14;
        color: #e2e8f0;
        overflow-x: hidden;
      }
      .neon-text {
        text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
      }
      .neon-border {
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #02040a;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00f0ff;
      }
      
      /* Futuristic Scanline Effect */
      .scanline-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.1) 50%,
          rgba(0,0,0,0.1)
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.15;
      }

      /* Leaflet Customization */
      .leaflet-popup-content-wrapper {
        background-color: #0f172a;
        color: #e2e8f0;
        border: 1px solid #00f0ff;
        border-radius: 8px;
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      }
      .leaflet-popup-tip {
        background-color: #0f172a;
        border: 1px solid #00f0ff;
      }
      
      /* Fix for map rendering issues and realistic look */
      .leaflet-container {
        width: 100%;
        height: 100%;
        background-color: #050a14;
        z-index: 1;
        outline: none;
      }
      
      /* Attribution Control Styling */
      .leaflet-control-attribution {
        background: rgba(5, 10, 20, 0.8) !important;
        color: #64748b !important;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .leaflet-control-attribution a {
        color: #00f0ff !important;
        text-decoration: none;
      }

      /* 
         Cyberpunk Satellite Filter 
         Technique: Grayscale -> Sepia -> Hue Rotate (to Cyan/Blue) -> Saturate -> Contrast
         Refined for better legibility and "high-tech" feel.
      */
      .satellite-mode .leaflet-tile-pane {
        filter: grayscale(100%) sepia(100%) hue-rotate(190deg) saturate(180%) brightness(0.7) contrast(1.2);
      }
      
      /* Glowing Markers */
      .custom-marker div {
        animation: marker-pulse 2s infinite;
      }
      
      @keyframes marker-pulse {
        0% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.7); }
        70% { box-shadow: 0 0 0 10px rgba(0, 240, 255, 0); }
        100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0); }
      }
    </style>

}
